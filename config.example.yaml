# MiniClaw user config example.
# Copy to ~/.miniclaw/config.yaml, then keep secrets in .env.
# Quote Discord IDs because they are larger than JavaScript's safe integer range.

discord:
  client_id: "your_discord_application_id"
  guild_id: "your_discord_guild_id"
  allowed_user_id: "your_discord_user_id"

routing:
  # Plain messages in these channels become lightweight chat replies.
  # Keep [] for the conservative install profile: users mention @MiniClaw explicitly.
  # Use ["*"] only when every allowed guild channel can chat without @mention.
  auto_reply_channels: []
  # Plain messages in these channels create /task-style task threads.
  # Task channels take precedence over auto-reply channels.
  task_channels: []
  # Optional per-channel task cwd. Explicit /task cwd still wins.
  channel_defaults:
    # "DISCORD_TASK_CHANNEL_ID":
    #   cwd: "~/ProjectRepo/miniclaw"
  smart_router:
    # Disabled by default to preserve existing chat behavior until you opt in.
    enabled: false
    default_mode: confirm # suggest | confirm | auto
    min_confirm_confidence: 0.55
    min_auto_confidence: 0.9
    # Use [] or ["*"] to allow any eligible auto-reply or mention channel to show upgrade buttons.
    confirm_channels: []
    # Auto task creation is trusted-channel only. Keep empty unless every message there should be executable work.
    auto_task_channels: []
    llm_classifier:
      enabled: true
      # Legacy compatibility field. Current LLM-first router calls the classifier
      # for every non-empty chat-eligible message when enabled.
      only_when_ambiguous: true
      # auto: use the same lightweight API boundary as chat:
      # ANTHROPIC_BASE_URL + ANTHROPIC_API_KEY first for Raven/Anthropic-compatible
      # Messages API, then OpenAI/OpenAI-compatible chat completions, otherwise Codex.
      provider: auto # auto | raven | anthropic | openai | openai_compatible | codex
      # inherit: raven/anthropic uses claude.model; openai/openai_compatible uses gpt-4o-mini.
      model: inherit
      timeout_ms: 8000
      # Keep false by default: if the lightweight API classifier fails, ask the
      # user to choose task/chat instead of starting a slower Codex classifier.
      fallback_to_codex: false
    confirmation:
      state: memory
      timeout_seconds: 600
    context:
      include_recent_when_referenced: true
      recent_turns: 6
      max_chars: 8000
    decision_log:
      enabled: true
      store: sqlite
      prompt_preview_chars: 160
      store_full_prompt: false

runtime:
  # Preferred task runtime selector. Keep values aligned with implemented AgentRuntime ids.
  default_agent: codex # claude | codex

agent_run_manager:
  # Managed multi-agent path. Disabled by default; enabling it routes /task
  # through the Agent Run Manager instead of the single-agent runtime.
  enabled: false
  # Optional auto mode. When enabled=false and auto_enabled=true, MiniClaw uses
  # a local complexity classifier to route medium/high-complexity tasks through
  # the manager while keeping simple tasks on the single-agent runtime.
  auto_enabled: false
  complexity_min_score: 4
  # Guardrails are enforced by the manager/bus before spawning children,
  # appending messages, or writing artifacts. Keep these conservative until
  # live MCP bus injection and restart recovery are fully hardened.
  max_turns: 12
  timeout_ms: 1800000 # 30 minutes per managed child run
  max_messages: 100
  max_artifact_bytes: 1000000
  max_spawn_depth: 1
  max_children_per_run: 8
  max_concurrent_runs: 3
  max_ping_pong_turns: 8
  cleanup_ttl_ms: 86400000 # 24 hours, used by sweeper/recovery cleanup
  max_fix_iterations: 2
  model_routing:
    # Role-aware model routing for managed child runs. Disabled by default so
    # normal Agent Run Manager behavior keeps using runtime.default_agent.
    enabled: false
    defaults:
      provider: inherit # inherit | claude | codex
      model: inherit
    roles:
      planner:
        provider: codex
        model: gpt-5.5
        reasoning_effort: high
      generator:
        provider: codex
        model: gpt-5-mini
        reasoning_effort: medium
      evaluator:
        provider: codex
        model: gpt-5-mini
        reasoning_effort: medium
    escalation:
      # When enabled, a failing or rejected generator turn can retry once with
      # the escalation override instead of rerunning the planner.
      enabled: false
      roles: [generator]
      provider: codex
      model: gpt-5.5
      reasoning_effort: high
      max_attempts: 1
  acp:
    # Task-scoped localhost ACP-style server. Disabled by default; when enabled
    # it starts only for managed tasks and stops when the task completes.
    enabled: false
    host: 127.0.0.1
    port: 0
    # Leave unset for an ephemeral per-task bearer token.
    # token: ""
    max_payload_bytes: 262144
    rate_limit_window_ms: 60000
    rate_limit_max_requests: 120
    trace_export_enabled: false
    trace_max_events: 200
    trace_max_bytes: 96000

model:
  # Preferred short-call ModelClient default for router/doctor-style calls.
  # routing.smart_router.llm_classifier.provider overrides this when set.
  default_client: auto # auto | raven | anthropic | openai | openai_compatible | codex

im:
  # Discord remains the default full-fidelity control plane. Feishu is currently
  # outbound-only for cron/task result fanout validation. Weixin direct is
  # opt-in, starts from local account state, and can serve chat/task without
  # waiting for Discord clientReady.
  default_transport: discord # discord | feishu | weixin
  transports:
    discord:
      enabled: true
    feishu:
      enabled: false
      # Prefer env for webhook secrets:
      #   MINICLAW_FEISHU_WEBHOOK_URL
      #   MINICLAW_FEISHU_SECRET
      # webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/..."
      # secret: ""
    weixin:
      enabled: false
      poll_enabled: false
      state_dir: "~/.miniclaw/weixin"
      # default_account_id: "xxxx-im-bot"
      # Default allowlist falls back to the scanner user saved by `pnpm weixin:login`.
      # Use ["*"] only for local smoke tests.
      allow_from: []
      # Direct Weixin input supports text, voice transcripts/audio, and images
      # when the Weixin payload exposes downloadable media URLs. Smart Router
      # task decisions are confirmed by y/n text in Weixin.
      # Legacy optional bridge id kept for older local configs; it is not
      # required for direct Weixin task execution.
      # task_bridge_channel_id: ""
  routes:
    # Logical route used by cron delivery_route. Existing cron channel stays the
    # primary Discord target; these targets receive extra outbound delivery.
    # daily-watchlist-stock:
    #   targets:
    #     - transport: feishu
    #       target: default
    #     - transport: weixin
    #       target: "user-id@im.wechat"
    #       account_id: "xxxx-im-bot"

agent:
  # Legacy compatibility alias. Keep it during transition; new task execution uses runtime.default_agent.
  provider: codex # claude | codex
  default_cwd: "~"
  max_concurrent_tasks: 1
  budget_usd: 1.0 # use unlimited for no cap
  max_turns: 30 # use unlimited for no cap
  chat_timeout_ms: 180000
  attachment_timeout_ms: 30000
  shutdown_drain_timeout_ms: 1800000 # 30 minutes
  register_commands_on_start: false

cron:
  active_window:
    # Optional global guard for scheduled cron dispatch. When enabled, every
    # scheduled cron job is recorded as skipped outside this local-time window.
    # Manual `pnpm cron:test` runs still bypass the guard for troubleshooting.
    enabled: false
    timezone: Asia/Shanghai
    start: "08:00"
    end: "00:00"

startup_watchdog:
  # Runs before Discord clientReady. If bot.login hangs or fails, MiniClaw can
  # still raise a local macOS notification instead of silently relying on PM2.
  enabled: true
  client_ready_timeout_ms: 60000
  macos_notification_enabled: true

memory_maintenance:
  # Background maintenance for ~/.miniclaw/memories/MEMORY.md.
  # It never injects lifecycle metadata into task/chat prompts; metadata is for cleanup only.
  enabled: true
  interval_ms: 86400000 # 24 hours
  apply: true
  run_on_start: false

tasks:
  trace_auto_attach:
    # Conservative default: keep automatic trace uploads off unless explicitly enabled.
    enabled: false
    # When enabled, attach traces for failed/cancelled/interrupted task terminal statuses.
    on_failure: true
    # Optional success-task thresholds; 0 disables each threshold.
    min_duration_ms: 0
    min_event_count: 0
    max_bytes: 120000

connectivity:
  enabled: true
  interval_ms: 60000
  failure_threshold: 3
  request_timeout_ms: 10000
  general_test_url: "https://www.qq.com"
  state_path: "~/.miniclaw/runtime/connectivity.json"

anthropic:
  # Keep ANTHROPIC_API_KEY in .env.
  # base_url: "http://localhost:7024"

openai:
  # Keep OPENAI_API_KEY in .env when needed.
  # base_url: "https://api.openai.com/v1"

claude:
  model: claude-opus-4-7
  setting_sources: [user, project, local] # use [] to disable filesystem settings
  disable_hooks: true

codex:
  # Set any field to inherit to let Codex CLI use ~/.codex/config.toml.
  model: inherit
  reasoning_effort: inherit
  sandbox:
    task: inherit
    chat: read-only
  approval_policy: inherit
  web_search: inherit
  timeout_ms: 1800000
  network_access: inherit

mcp:
  # Claude provider task mode can reuse MCP servers from Claude Code config.
  config: "~/.claude.json"
  # Add futu-stock explicitly only after you have configured its local read-only MCP server.
  allowlist: [exa, context7] # use ["*"] to expose every server

storage:
  db_path: "~/.miniclaw/data.db"
  memory_path: "~/.miniclaw/memories/MEMORY.md"

state:
  retention:
    # Cleanup is dry-run by default. Use `pnpm run state:cleanup -- --execute`
    # only after reviewing the dry-run candidate counts.
    dry_run_default: true
    chat_history_days: 90
    task_events_days: 90
    smart_router_decisions_days: 180
    incidents_days: 365
    repair_runs_days: 365
    market_forecasts_days: 730

doctor:
  enabled: true
  # Keep false until the summary channel is configured and a manual /doctor smoke test passes.
  auto_diagnose_enabled: false
  scan_interval_ms: 7200000 # 2 hours
  # Auto Doctor/Auto Improve notifications. ID wins when both are set.
  # Quote Discord IDs. If the ID is blank, MiniClaw looks for this channel name in the configured guild.
  summary_channel_id: ""
  summary_channel_name: "miniclaw-auto-improve"
  auto_repair_enabled: false
  auto_commit_enabled: true
  auto_push_enabled: false
  auto_restart_enabled: false
  max_repairs_per_day: 2
  max_parallel_repairs: 1
  max_patch_files: 8
  repair_worktree_root: "~/ProjectRepo/miniclaw-repairs"
  repair_commit_author_name: "yuanyunfan"
  repair_commit_author_email: "59247355+yuanyunfan@users.noreply.github.com"
  require_approval_for_main: true
  allowed_paths:
    - "src/**/*.ts"
    - "scripts/**/*.ts"
    - "docs/**/*.md"
    - "prompts/**/*.md"
    - "config.example.yaml"
  blocked_paths:
    - ".env"
    - ".env.*"
    - ".npmrc"
    - ".netrc"
    - "~/.miniclaw/**"
    - "~/.ssh/**"
    - "**/*.db"
    - "**/*.sqlite"
    - "**/*.log"

e2e:
  # Test-only mode for Discord E2E harnesses. Production config should keep this false.
  mode: false
  # Dedicated sender bot/user IDs allowed to drive E2E messages when mode is true.
  sender_user_ids: []
  # Keep true in E2E mode so test runs cannot load or execute local cron jobs.
  disable_scheduler: false
  # Use deterministic fake chat/task agent for Discord E2E without Claude/Codex calls.
  fake_agent: false

attachments:
  max_mb: 32
  max_count: 10
  audio_transcription:
    enabled: true
    # auto: OPENAI_API_KEY exists -> OpenAI; otherwise local faster-whisper.
    # Raven/Codex proxy does not provide /audio/transcriptions, so local_faster_whisper
    # is the recommended provider when using Raven without an OpenAI key.
    provider: auto # auto | openai | openai_compatible | local_faster_whisper
    # OpenAI/OpenAI-compatible transcription model.
    model: gpt-4o-mini-transcribe
    # Local faster-whisper runtime options.
    local_model: base
    local_python: python3
    local_device: cpu
    local_compute_type: int8
    max_mb: 25
    timeout_ms: 120000
    # Optional ISO-639-1 language hint, for example zh or en.
    language: ""
