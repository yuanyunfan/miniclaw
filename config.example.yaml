# MiniClaw user config example.
# Copy to ~/.miniclaw/config.yaml, then keep secrets in .env.
# Quote Discord IDs because they are larger than JavaScript's safe integer range.

discord:
  client_id: "your_discord_application_id"
  guild_id: "your_discord_guild_id"
  allowed_user_id: "your_discord_user_id"

routing:
  # Plain messages in these channels become lightweight chat replies.
  auto_reply_channels: []
  # Plain messages in these channels create /task-style task threads.
  # Task channels take precedence over auto-reply channels.
  task_channels: []
  # Optional per-channel task cwd. Explicit /task cwd still wins.
  channel_defaults:
    # "1501826352028975125":
    #   cwd: "/Users/you/ProjectRepo/miniclaw"
  smart_router:
    # Disabled by default to preserve existing chat behavior until you opt in.
    enabled: false
    default_mode: confirm # suggest | confirm | auto
    min_confirm_confidence: 0.55
    min_auto_confidence: 0.9
    # Empty confirm_channels means any eligible auto-reply or mention channel can show upgrade buttons.
    confirm_channels: []
    # Auto task creation is trusted-channel only. Keep empty unless every message there should be executable work.
    auto_task_channels: []
    llm_classifier:
      enabled: true
      only_when_ambiguous: true
    confirmation:
      state: memory
      timeout_seconds: 600
    context:
      include_recent_when_referenced: true
      recent_turns: 6
      max_chars: 8000
    decision_log:
      enabled: true
      store: sqlite
      prompt_preview_chars: 160
      store_full_prompt: false

agent:
  provider: claude # claude | codex
  default_cwd: "~/Code"
  max_concurrent_tasks: 3
  budget_usd: 1.0 # use unlimited for no cap
  max_turns: 30 # use unlimited for no cap
  chat_timeout_ms: 180000
  attachment_timeout_ms: 30000
  shutdown_drain_timeout_ms: 1800000 # 30 minutes
  register_commands_on_start: false

anthropic:
  # Keep ANTHROPIC_API_KEY in .env.
  # base_url: "http://localhost:7024"

openai:
  # Keep OPENAI_API_KEY in .env when needed.
  # base_url: "https://api.openai.com/v1"

claude:
  model: claude-opus-4-7
  setting_sources: [user, project, local] # use [] to disable filesystem settings
  disable_hooks: true

codex:
  # Set any field to inherit to let Codex CLI use ~/.codex/config.toml.
  model: gpt-5.5
  reasoning_effort: medium
  sandbox:
    task: workspace-write
    chat: read-only
  approval_policy: never
  web_search: live
  timeout_ms: 1800000
  network_access: true

mcp:
  # Claude provider task mode can reuse MCP servers from Claude Code config.
  config: "~/.claude.json"
  # Add futu-stock explicitly only after you have configured its local read-only MCP server.
  allowlist: [exa, context7] # use ["*"] to expose every server

storage:
  db_path: "~/.miniclaw/data.db"
  memory_path: "~/.miniclaw/memories/MEMORY.md"

doctor:
  enabled: true
  # Keep false until the summary channel is configured and a manual /doctor smoke test passes.
  auto_diagnose_enabled: false
  scan_interval_ms: 7200000 # 2 hours
  # Auto Doctor/Auto Improve notifications. ID wins when both are set.
  # Quote Discord IDs. If the ID is blank, MiniClaw looks for this channel name in the configured guild.
  summary_channel_id: ""
  summary_channel_name: "miniclaw-auto-improve"
  auto_repair_enabled: false
  auto_commit_enabled: true
  auto_push_enabled: false
  auto_restart_enabled: false
  max_repairs_per_day: 2
  max_parallel_repairs: 1
  max_patch_files: 8
  repair_worktree_root: "~/ProjectRepo/miniclaw-repairs"
  repair_commit_author_name: "yuanyunfan"
  repair_commit_author_email: "59247355+yuanyunfan@users.noreply.github.com"
  require_approval_for_main: true
  allowed_paths:
    - "src/**/*.ts"
    - "scripts/**/*.ts"
    - "docs/**/*.md"
    - "prompts/**/*.md"
    - "config.example.yaml"
  blocked_paths:
    - ".env"
    - ".env.*"
    - ".npmrc"
    - ".netrc"
    - "~/.miniclaw/**"
    - "~/.ssh/**"
    - "**/*.db"
    - "**/*.sqlite"
    - "**/*.log"

e2e:
  # Test-only mode for Discord E2E harnesses. Production config should keep this false.
  mode: false
  # Dedicated sender bot/user IDs allowed to drive E2E messages when mode is true.
  sender_user_ids: []
  # Keep true in E2E mode so test runs cannot load or execute local cron jobs.
  disable_scheduler: false
  # Use deterministic fake chat/task agent for Discord E2E without Claude/Codex calls.
  fake_agent: false

attachments:
  max_mb: 32
  max_count: 10
