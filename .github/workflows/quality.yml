name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: G0 safety
        run: pnpm run quality:g0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:cov

      - name: Coverage ratchet
        run: pnpm run quality:coverage

      - name: Cron E2E fixture
        run: pnpm run e2e:cron

      - name: Dependency scan
        run: pnpm run quality:deps

      - name: Build
        run: pnpm run build
