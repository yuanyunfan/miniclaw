name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version without v prefix, for example 1.0.0"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_EXISTS=true
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          else
            VERSION="$INPUT_VERSION"
            TAG_EXISTS=false
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release v$VERSION prerelease=$PRERELEASE tag_exists=$TAG_EXISTS"

      - name: Validate release inputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $VERSION" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release input ($VERSION)" >&2
            exit 1
          fi
          if ! grep -q "^## \\[$VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a section for [$VERSION]" >&2
            exit 1
          fi
          if [ "$TAG_EXISTS" != "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Quality push gate
        run: pnpm run quality:push

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/N;/^\n$/D' > release-notes.md
          test -s release-notes.md

      - name: Build source artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ROOT="miniclaw-$TAG"
          rm -rf release-work "$ROOT.tar.gz"
          mkdir -p release-work
          git archive --format=tar --prefix="$ROOT/" HEAD | tar -x -C release-work
          mkdir -p "release-work/$ROOT/dist"
          cp -R dist/. "release-work/$ROOT/dist/"
          tar -czf "$ROOT.tar.gz" -C release-work "$ROOT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if [ "$TAG_EXISTS" = "true" ]; then
            ARGS+=(--verify-tag)
          fi
          gh release create "v$VERSION" "miniclaw-v$VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "MiniClaw v$VERSION" \
            --notes-file release-notes.md \
            "${ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniclaw-v${{ steps.release.outputs.version }}
          path: miniclaw-v${{ steps.release.outputs.version }}.tar.gz
